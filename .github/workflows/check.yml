name: check

# 브랜치 push·PR 때 테스트와 clippy 를 돌린다. 로컬 맥에서는 Rust/WASM/Tauri 빌드를 하지 않으므로
# (메모리가 모자라 멈춘다) 코드 변경은 이 검사로 확인한다. 저장소의 vendor WASM 을 그대로 쓴다.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  RUST_TOOLCHAIN: '1.93.1'

jobs:
  check:
    name: 테스트·clippy (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: rhwp 받기와 패치
        run: scripts/prepare-rhwp.sh

      # 화면 빌드는 third_party/rhwp/pkg 의 WASM 을 찾는다. 검사에서는 다시 빌드하지 않고 저장소 사본을 쓴다.
      - name: 저장소 WASM 사본 넣기
        run: |
          mkdir -p third_party/rhwp/pkg
          cp apps/studio-host/vendor/rhwp-core/* third_party/rhwp/pkg/

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: check

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # test:upstream 의 HOP 시절 검사 7개는 K-Doc 워크플로와 맞지 않아 원래부터 실패한다(정리 대기).
      # K-Doc 이 관리하는 저장소 검사만 돌린다.
      - name: 저장소 검사
        run: node --test tests/hop-version.test.mjs tests/file-associations.test.mjs tests/agent-cli-bundle.test.mjs

      - name: test:studio
        run: pnpm run test:studio

      - name: build:studio
        run: pnpm run build:studio

      # tauri.conf.json 의 externalBin(k-doc-agent)은 빌드 때 파일이 있어야 한다. 검사에서는 빈 자리표시를 둔다
      # (실제 도구는 아래 parity 작업과 release 에서 빌드한다).
      - name: 에이전트 도구 자리표시
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > "apps/desktop/src-tauri/binaries/k-doc-agent-$host"
          chmod +x "apps/desktop/src-tauri/binaries/k-doc-agent-$host"

      - name: test:desktop
        run: pnpm run test:desktop

      - name: clippy:desktop
        run: pnpm run clippy:desktop

  parity:
    name: 에이전트 도구 = 화면 엔진 (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: rhwp 받기와 패치
        run: scripts/prepare-rhwp.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/rhwp -> target
          key: agent-cli

      - name: 에이전트 도구 빌드
        run: scripts/build-agent-cli.sh x86_64-unknown-linux-gnu

      # 에이전트가 MCP 로 그린 쪽과 K-Doc 화면 엔진(저장소 WASM)이 그린 쪽이 바이트까지 같은지 본다.
      - name: 화면 일치 검사
        run: |
          node scripts/agent-parity.mjs \
            --agent apps/desktop/src-tauri/binaries/k-doc-agent-x86_64-unknown-linux-gnu \
            third_party/rhwp/samples/two_column_exam_floats/*.hwpx \
            "third_party/rhwp/samples/2010-01-06.hwp" \
            "third_party/rhwp/samples/2022년 국립국어원 업무계획.hwp"

  # 엔진 패치(patches/rhwp)를 고치면 그 단위 테스트를 돌리고, 저장소 WASM 사본을 바꿀 때 쓸
  # 빌드 산출물(rhwp-pkg)을 올린다. 로컬 맥에서는 Rust/WASM 을 빌드하지 않는다.
  engine:
    name: 엔진 테스트·WASM (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WASM_PACK_VERSION: '0.15.0'
    steps:
      - uses: actions/checkout@v5

      - name: rhwp 받기와 패치
        run: scripts/prepare-rhwp.sh

      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/rhwp -> target
          key: engine

      # K-Doc 패치가 다루는 영역의 단위 테스트(이름 필터).
      - name: 엔진 단위 테스트
        working-directory: third_party/rhwp
        run: cargo test --locked -p rhwp --lib -- equation picture_in_cell equalize page_number_field paragraph_band page_number_pos footnote_shape char_overlap_insert convert_notes text_table_conversion

      - name: wasm-pack
        run: |
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 5 -o /tmp/wasm-pack.tgz \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          tar -xzf /tmp/wasm-pack.tgz -C /tmp
          sudo mv "/tmp/${name}/wasm-pack" /usr/local/bin/wasm-pack

      - name: WASM 빌드
        working-directory: third_party/rhwp
        run: scripts/wasm-pack-locked.sh --target web --out-dir pkg

      - uses: actions/upload-artifact@v7
        with:
          name: rhwp-pkg
          path: third_party/rhwp/pkg/
          retention-days: 7
