<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0E9F9A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1B3F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- K-Doc 앱 아이콘. macOS 격자: 1024 캔버스, 824 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- 문서 한 장 (오른쪽 위 접힌 모서리) -->
  <g filter="url(#shadow)">
    <path d="M300 220 H620 L724 324 V804 Q724 828 700 828 H300 Q276 828 276 804 V244 Q276 220 300 220 Z" fill="url(#paper)"/>
    <path d="M620 220 V300 Q620 324 644 324 H724 Z" fill="#C9D6E6"/>
  </g>

  <!-- 'K' -->
  <g stroke="#1E3A8A" stroke-linecap="round" fill="none">
    <path d="M392 318 V606" stroke-width="58"/>
    <path d="M598 318 L428 466 L604 606" stroke-width="56" stroke-linejoin="round"/>
  </g>
  <!-- 문서 줄 -->
  <g fill="#C9D6E6">
    <rect x="352" y="680" width="260" height="24" rx="12"/>
    <rect x="352" y="732" width="180" height="24" rx="12"/>
  </g>

  <!-- 편집을 뜻하는 연필 -->
  <g transform="translate(704 650) rotate(45)">
    <rect x="-34" y="-150" width="68" height="190" rx="12" fill="#F59E0B"/>
    <rect x="-34" y="-176" width="68" height="40" rx="12" fill="#F472B6"/>
    <rect x="-34" y="-150" width="68" height="16" fill="#E5E7EB"/>
    <path d="M-34 40 L34 40 L0 104 Z" fill="#FDE6C4"/>
    <path d="M-12 82 L12 82 L0 104 Z" fill="#1F2937"/>
  </g>
</svg>
